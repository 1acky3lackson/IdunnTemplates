spring.application.name=backend
server.port=8080

# Yggdrasil API Configuration
# Replace with the actual skin server auth URL
# Standard Yggdrasil auth endpoint ends with /authserver/authenticate
yggdrasil.api.url=https://skin.taixue.cc/api/yggdrasil/authserver/authenticate

# JWT Configuration
# 256-bit secret key (32 bytes)
jwt.secret=${JWT_SECRET:changeMeToARandomSecretKeyThatIsAtLeast32CharactersLong}
jwt.expiration=86400000

# Database Configuration
# Options: sqlite, postgres
app.datasource.type=${DB_TYPE:sqlite}

# SQLite Configuration
app.datasource.sqlite.file-path=${SQLITE_FILE:D:/dev/IdunnTemplates/plugin/run/idunn/data.db}

# Postgres Configuration
app.datasource.postgres.url=${POSTGRES_URL:jdbc:postgresql://localhost:5432/idunn}
app.datasource.postgres.username=${POSTGRES_USER:postgres}
app.datasource.postgres.password=${POSTGRES_PASSWORD:postgres}

# Spring Data JPA / Hibernate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Note: The actual DataSource bean configuration will be handled in a config class
# to switch based on app.datasource.type
