spring.application.name=backend
server.port=8080

# Yggdrasil API Configuration
# Replace with the actual skin server auth URL
# Standard Yggdrasil auth endpoint ends with /authserver/authenticate
yggdrasil.api.url=https://skin.example.com/api/yggdrasil/authserver/authenticate

# JWT Configuration
# 256-bit secret key (32 bytes)
jwt.secret=changeMeToARandomSecretKeyThatIsAtLeast32CharactersLong
jwt.expiration=86400000
