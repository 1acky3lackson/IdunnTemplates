# ===================================================================
# 核心服务器配置 (Server Core)
# ===================================================================
# 应用名称，用于日志和监控标识
spring:
  application:
    name: backend
  # ===================================================================
  # JPA / Hibernate 配置 (关键部分)
  # ===================================================================
  jpa:
    # --- DDL 自动生成策略 (解决表未创建的核心配置) ---
    # update: 启动时检查数据库结构，如果表不存在则创建，如果变动则更新 (开发环境推荐)
    # validate: 仅检查数据库结构是否匹配实体类，不修改 (生产环境推荐)
    # none: 什么都不做
    hibernate:
      ddl-auto: update

    # --- 数据库方言 (Dialect) ---
    # [注意] 如果使用 SQLite，建议强制指定社区版方言，否则可能会出现 "Identity" 生成策略报错
    # 如果切换到 PostgreSQL，Spring 通常能自动检测，或者注释掉此行
    database-platform: org.hibernate.community.dialect.SQLiteDialect

    # --- 调试与日志 (Debug & Logs) ---
    # 在控制台打印 Hibernate 生成的 SQL 语句
    show-sql: true

    # 保持 Session 在 View 层打开 (解决懒加载 LazyInitializationException 问题)
    # 注意：在高性能要求的场景下建议设为 false 并手动处理事务
    open-in-view: true

  # 后端服务监听的端口
server:
  port: 8080

# ===================================================================
# 认证与安全配置 (Authentication & Security)
# ===================================================================
# --- Yggdrasil API (皮肤站/Minecraft 认证) ---
# 用于验证玩家 Token 的有效性
# 标准的 Yggdrasil 验证端点通常以 /authserver/authenticate 结尾
yggdrasil:
  api:
    url: https://littleskin.cn/api/yggdrasil/authserver/authenticate

# --- JWT (JSON Web Token) ---
# 用于生成和验证后端签发的 API Token
# 注意：生产环境请务必通过环境变量 JWT_SECRET 覆盖此默认值
# 密钥长度必须至少 32 个字符 (256-bit) 以确保安全
jwt:
  secret: ${JWT_SECRET:changeMeToARandomSecretKeyThatIsAtLeast32CharactersLong}
  # Token 过期时间，单位：毫秒 (86400000 ms = 24 小时)
  expiration: 86400000

# ===================================================================
# 数据库策略配置 (Database Strategy)
# ===================================================================
# 决定使用哪种数据库驱动
# 可选值: sqlite, postgres
# 默认值: sqlite (方便本地开发调试)
app:
  datasource:
    type: ${DB_TYPE:sqlite}

    # ===================================================================
    # SQLite 数据库配置 (Dev / Local)
    # ===================================================================
    # SQLite 数据库文件的绝对路径
    # 建议：Windows路径使用正斜杠 / 或双反斜杠 \\
    sqlite:
      file-path: ${SQLITE_FILE:C:/Users/Jacky/Desktop/Dev/IdunnTemplates/plugin/run/idunn/data.db}

    # ===================================================================
    # PostgreSQL 数据库配置 (Production)
    # ===================================================================
    # 生产环境建议使用 PostgreSQL 以获得更好的并发性能
    postgres:
      url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/idunn}
      username: ${POSTGRES_USER:postgres}
      password: ${POSTGRES_PASSWORD:postgres}

  # ===================================================================
  # 文件系统配置
  # ===================================================================
  # 指向实际存放 .schem 文件的根目录
  # 在本地测试时，填写绝对路径
  storage:
    schematic-root-dir: C:/Users/Jacky/Desktop/Dev/IdunnTemplates/plugin/run/idunn/templates
  server:
    internal-host: localhost
  service:
    # schem 文件渲染服务的地址，最后不带 /
    # 要求能够被后端服务所访问，可以是任何的 url
    schematic-renderer-base-url: http://localhost:3000
    # idunn auth service backend url
    idunn-auth-base-url: http://localhost:8085
    # idunn auth service backend url
    idunn-user-info-url: http://localhost:8085/userinfo

  crawler:
    interval-ms: 3600000
    ne:
      comp-product-span: 10
      pe-product-span: 10
      pe-product-order-days: 7
      pe-product-stat-days: 7
      pe-product-comment-span: 10
      pe-product-feedback-span: 10
      interval-ms: 1000
      users:
