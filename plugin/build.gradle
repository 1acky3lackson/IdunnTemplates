plugins {
    id 'java'
    id("xyz.jpenilla.run-paper") version "2.3.1"
    id "com.gradleup.shadow" version "8.3.9"
}

group = 'com.jackyblackson'
version = '2.3.1'

repositories {
    mavenCentral()
    maven {
        name = "spigotmc-repo"
        url = "https://hub.spigotmc.org/nexus/content/repositories/snapshots/"
    }
    maven {
        url = "https://maven.enginehub.org/repo/"
    }
}

dependencies {
    implementation project(':common')

    compileOnly("org.spigotmc:spigot-api:1.21.1-R0.1-SNAPSHOT")
    compileOnly("com.fastasyncworldedit:FastAsyncWorldEdit-Core:2.12.0")
    compileOnly("com.fastasyncworldedit:FastAsyncWorldEdit-Bukkit:2.12.0") { transitive = false }

    // ORMLite is provided by common module (api)

    // [新增] 数据库连接池 (生产环境必备，防止数据库连接断开或卡顿)
    implementation 'com.zaxxer:HikariCP:5.1.0'

    // [新增] SQLite 驱动 (如果你打算支持本地单文件数据库)
    implementation 'org.xerial:sqlite-jdbc:3.46.0.0'

    // [可选] 如果你想支持 MySQL，取消下面这行的注释
    implementation 'com.mysql:mysql-connector-j:8.3.0'

    // [新增] PostgreSQL 驱动
    // 42.7.x 是目前稳定且兼容性较好的版本
    implementation 'org.postgresql:postgresql:42.7.2'

    // LuckPerms API
    compileOnly("net.luckperms:api:5.4")
}

tasks {
    runServer {
        minecraftVersion("1.21")
        // 建议：如果你是手动指定的路径，使用这种更稳健的写法
//        def agentFile = file("D:/dev/IdunnTemplates/plugin/run/authlib-injector-1.2.7.jar")
//
//        if (!agentFile.exists()) {
//            throw new GradleException("找不到 authlib-injector: " + agentFile.absolutePath)
//        }

        // 使用绝对路径，并确保没有多余的符号
        jvmArgs("-javaagent:D:/dev/IdunnTemplates/plugin/run/authlib-injector-1.2.7.jar=https://skin.taixue.cc/api/yggdrasil")

        // 可选：增加此参数以获得详细的注入日志，方便排查
        jvmArgs("-Dauthlibinjector.debug")
    }

    shadowJar {
        archiveFileName = "${rootProject.name}-${project.name}-${project.version}.jar"
        // 重命名 ORMLite
        relocate 'com.j256.ormlite', 'com.jackyblackson.libs.ormlite'
        // 重命名 HikariCP
        relocate 'com.zaxxer.hikari', 'com.jackyblackson.libs.hikari'

        minimize()
        archiveClassifier.set('')
    }

    build {
        dependsOn shadowJar
    }
}

def targetJavaVersion = 21
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}
