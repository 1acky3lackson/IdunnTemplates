      usage: "&cUsage: /idunn brush preset save [<namespace>:]<name> <description>"
      no_brushes: "&cThis item has no bound brushes."
      success: "&aSaved brush preset '%1%' to namespace '%2%'."
    update:
      usage: "&cUsage: /idunn brush preset update [<namespace>:]<name>"
      not_exist: "&cPreset '%1%' does not exist in namespace '%2%'. Use 'save' to create it."
      success: "&aUpdated brush preset '%1%' in namespace '%2%'."
