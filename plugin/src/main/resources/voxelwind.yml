# 2. 允许的组合规则 (Allow-list)
rules:
  ##########################
  # WOODS
  ##########################
  o: &wood_group [lg, wd, pl, tdr, dr, fg, f, sgn, hsg, btn, plt]
  s: *wood_group
  b: *wood_group
  j: *wood_group
  a: *wood_group
  do: *wood_group
  m: *wood_group
  c: *wood_group
  ##########################
  # STONES
  ##########################
  st: [sl, st]
  c: [sl, st, w]
  ##########################
  # COLORABLES
  ##########################
  bk: &color_blocks [g, gp, wl, cp, cpd, c, t, gt, skb, bd, fl, bn, cdl]
  gy: *color_blocks
  lg: *color_blocks
  wh: *color_blocks
  pk: *color_blocks
  mg: *color_blocks
  pp: *color_blocks
  lb: *color_blocks
  cy: *color_blocks
  gr: *color_blocks
  lm: *color_blocks
  yl: *color_blocks
  or: *color_blocks
  rd: *color_blocks
  br: *color_blocks

# 3. 直白映射 (Direct Mappings)
# 优先级最高，直接一对一指定 Minecraft ID
direct_mappings:
  r-g: red_stained_glass
  b-g: blue_stained_glass
  d-o: dirt_path