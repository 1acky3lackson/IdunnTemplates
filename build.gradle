plugins {
    id 'java'
    id("xyz.jpenilla.run-paper") version "2.3.1"
    id "com.gradleup.shadow" version "8.3.9"
}

group = 'com.jackyblackson'
version = '2.0.0'

repositories {
    mavenCentral()
    maven {
        name = "spigotmc-repo"
        url = "https://hub.spigotmc.org/nexus/content/repositories/snapshots/"
    }
    maven {
        url = "https://maven.enginehub.org/repo/"
    }
}

dependencies {
    compileOnly("org.spigotmc:spigot-api:1.21.1-R0.1-SNAPSHOT")
    compileOnly("com.fastasyncworldedit:FastAsyncWorldEdit-Core:2.12.0")
    compileOnly("com.fastasyncworldedit:FastAsyncWorldEdit-Bukkit:2.12.0") { transitive = false }

    // [新增] ORM 核心库
    // 使用 implementation 确保它们会被 Shadow 插件打包
    implementation 'com.j256.ormlite:ormlite-jdbc:6.1'

    // [新增] 数据库连接池 (生产环境必备，防止数据库连接断开或卡顿)
    implementation 'com.zaxxer:HikariCP:5.1.0'

    // [新增] SQLite 驱动 (如果你打算支持本地单文件数据库)
    implementation 'org.xerial:sqlite-jdbc:3.46.0.0'

    // [可选] 如果你想支持 MySQL，取消下面这行的注释
    implementation 'com.mysql:mysql-connector-j:8.3.0'

    // [新增] PostgreSQL 驱动
    // 42.7.x 是目前稳定且兼容性较好的版本
    implementation 'org.postgresql:postgresql:42.7.2'
}

tasks {
    runServer {
        // Configure the Minecraft version for our task.
        // This is the only required configuration besides applying the plugin.
        // Your plugin's jar (or shadowJar if present) will be used automatically.
        minecraftVersion("1.21")
    }
    // [新增] 配置 Shadow Jar 的重定位 (Relocation)
    // 这一步非常重要！它会将 com.j256.ormlite 重命名为 com.jackyblackson.libs.ormlite
    // 这样如果另一个插件也用了 ORMLite 但版本不同，你们互不干扰。
    shadowJar {
        // 重命名 ORMLite
        relocate 'com.j256.ormlite', 'com.jackyblackson.libs.ormlite'
        // 重命名 HikariCP
        relocate 'com.zaxxer.hikari', 'com.jackyblackson.libs.hikari'
        // 重命名 SQLite (如果打包进去的话)
//        relocate 'org.sqlite', 'com.jackyblackson.libs.sqlite'
        // [新增] 重定位 PostgreSQL 驱动
        // 这一步非常重要，因为很多其他插件或服务端核心也可能包含 Postgres 驱动
//        relocate 'org.postgresql', 'com.jackyblackson.libs.postgresql'

        // 排除不必要的文件以减小体积
        minimize()

        // 确保生成的 jar 文件名没有 "-all" 后缀，方便直接替换旧插件
        archiveClassifier.set('')
    }

    // 让标准的 build 任务依赖 shadowJar
    build {
        dependsOn shadowJar
    }
}

def targetJavaVersion = 21
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}
