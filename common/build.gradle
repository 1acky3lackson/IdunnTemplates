plugins {
    id 'java-library'
}

dependencies {
    api 'com.j256.ormlite:ormlite-jdbc:6.1'
    api 'com.google.code.gson:gson:2.10.1'
    api 'jakarta.persistence:jakarta.persistence-api:3.1.0'
    // Source: https://mvnrepository.com/artifact/com.fasterxml.jackson.core/jackson-annotations
    api group: 'com.fasterxml.jackson.core', name: 'jackson-annotations', version: '2.21'
    // Source: https://mvnrepository.com/artifact/org.hibernate.orm/hibernate-core
    api group: 'org.hibernate.orm', name: 'hibernate-core', version: '7.2.2.Final'
}
