name: Backend Deployment

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive # 确保子模块也被拉取

      - name: Pack Source Code
        # 使用 tar 打包，排除 .git 等冗余文件以减小体积
        run: |
          tar -czf source_code.tar.gz \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='backend/build' \
            .

      - name: Add SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.SSH_PORT }} -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Transfer and Extract Source
        # 1. 确保目标目录存在
        # 2. 将压缩包传输到服务器
        # 3. 在服务器端解压并清理压缩包
        run: |
          ssh -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "mkdir -p /home/taixue/data/services/idunn-backend/build/src"
          
          rsync -avz -e "ssh -p ${{ secrets.SSH_PORT }}" \
            source_code.tar.gz \
            ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:/home/taixue/data/services/idunn-backend/build/src/

          ssh -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "cd /home/taixue/data/services/idunn-backend/build/src && tar -xzf source_code.tar.gz && rm source_code.tar.gz"

      - name: Execute Remote Build Script
        run: |
          ssh -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "bash /home/taixue/data/services/idunn-backend/build-remote.sh"
