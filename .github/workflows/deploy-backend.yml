name: Backend Deployment

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # 关键点：开启子模块递归拉取
          submodules: recursive
          # 如果你的子模块在私有仓库，且需要特定的 Token 访问，可以取消注释下面一行
          # token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          # 如果根目录有 gradle 依赖，可以开启缓存
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        # 在 monorepo 中，进入 backend 目录执行构建，或通过参数指定
        run: ./gradlew clean build bootJar --no-daemon

      - name: Add SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.SSH_PORT }} -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Sync JAR to Server
        # 将 backend/build/libs/ 下的 jar 包同步到目标目录
        # 注意：这里假设你的 jar 包名包含版本号或为 backend.jar
        run: |
          rsync -avz -e "ssh -p ${{ secrets.SSH_PORT }}" \
          backend/build/libs/ \
          ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:/home/taixue/data/services/idunn-backend/build/lib

      - name: Execute Remote Build Script
        run: |
          ssh -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "bash /home/taixue/data/services/idunn-backend/build-remote.sh"
